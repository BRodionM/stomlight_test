<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; }
        .container { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; }
        .btn-submit { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Запись в Стомлайт</h2>
        <div class="form-group">
            <label>Имя пациента</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>Выберите специалиста</label>
            <select id="doctor">
                <option>Терапевт (Кариес)</option>
                <option>Ортопед (Протезирование)</option>
                <option>Гигиенист (Чистка)</option>
            </select>
        </div>
        <button class="btn-submit" onclick="submit()">Подтвердить запись</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function submit() {
            const data = {
                name: document.getElementById('name').value,
                doctor: document.getElementById('doctor').value,
                timestamp: new Date().toISOString()
            };
            if(data.name === "") return alert("Заполните имя!");
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
