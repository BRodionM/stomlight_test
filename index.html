<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .tab { display: none; } .active { display: block; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .img-placeholder { width: 100%; height: 200px; background: #ddd; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="booking-tab" class="tab active">
        <div class="card">
            <h3>Запись на прием</h3>
            <input type="text" id="name" placeholder="Ваше ФИО">
            <select id="doctor"><option>Терапевт</option><option>Ортопед</option><option>Хирург</option></select>
            <button onclick="submit()">Отправить запись</button>
        </div>
    </div>
    
    <div id="gallery-tab" class="tab">
        <h2>Галерея работ</h2>
        <div class="img-placeholder">Виниры (До/После)</div>
        <div class="img-placeholder">Имплантация (До/После)</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function submit() {
            let data = { name: document.getElementById('name').value, doctor: document.getElementById('doctor').value };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
